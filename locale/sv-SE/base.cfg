[technology-description]
MOX-fuel-reprocessing=Process för att upparbeta uttjänta MOX-bränsleceller för att få MOX och forskningsdata.
MOX-processing=Blandoxid (MOX) framställs genom att blanda uran och plutonium för att skapa kraftfullare bränsleceller.
MOX-processing-simple=Blandoxidbränsle (MOX) framställs genom att blanda plutonium och utarmat uran. Uttjänta celler innehåller olika isotoper.
nuclear-fuel-reprocessing=Process för upparbetning av använda uranbränsleceller för att få ut uran-238, plutonium och forskningsdata.
nuclear-fuel-reprocessing-simple=Upparbetning av använt uranbränsle ger uranmalm och klyvningsprodukter.
nuclear-power=Kraftfull och avancerad metod för elproduktion med bränsleceller.
plutonium-fuel-reprocessing=Process för upparbetning av använda plutoniumbränsleceller för att få ut plutonium och forskningsdata.
plutonium-processing=Plutonium erhålls genom upparbetning av uranbränsleceller för att tillverka kraftfullare bränsleceller.
thorium-fuel-reprocessing=Process för att upparbeta uttjänta toriumbränsleceller för att få torium och forskningsdata.
thorium-processing=Torium utvinns ur uranmalm i en centrifug för att skapa kraftfullare bränsleceller. (Inte realistiskt.)
thorium-module=En modul som hjälper till med bearbetnings- och upparbetningsrecept.
thorium-module-2=En modul som hjälper till med bearbetnings- och upparbetningsrecept.
thorium-module-3=En modul som hjälper till med bearbetnings- och upparbetningsrecept.
waste-reprocessing=Process för återvinning av kärnavfall (inte realistiskt)
uranium-processing-simple=Bruten uranmalm innehåller 0,7 % av den klyvbara isotopen uran-235 och kan bearbetas till låganrikat uran (5 % U235) och därefter till höganrikat uran (90 % U235). Biprodukten utarmat uran innehåller nästan enbart inaktivt uran-238.
fissile-products-reprocessing=Återvinning av klyvningsprodukter samt utvinning av plutonium och oanvändbart radioaktivt avfall
kovarex-simple=Processen för att framställa låganrikat uran från uran-238. Den kräver en stor mängd låganrikat uran som katalysator.
ao-breeder-reactions=Reaktor med snabba neutroner och bridning av plutonium-239 med medelanrikat uran-235-bränsle.
nuclear-rocket-fuel=Att tillföra klyvbart material till raketbränslet gör det mer kraftfullt
heating-oil=Tillverka eldningsolja av råolja för att fylla en särskilt belagd vätsketank. När tanken är helt fylld kan den lagra överskottsvärme från dina kärnreaktorer.

