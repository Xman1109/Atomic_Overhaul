ao-complexity-level-advanced=Avancerad moddupplevelse – en mellannivå förväntas.
ao-complexity-level-simple=Endast plutonium och MOX-bränsle läggs till. Upparbetning av kärnbränsle och atombomben utökas. Bridning som alternativ till Kovarex finns som tillval.

