[mod-setting-description]
ao-debug=Skriver information om Atomic Overhauls inlästa kompatibilitetsstöd till factorio-current.log när spelet startas. Prova inställningen om en modd inte är kompatibel med AO.
ao-complexity-level=Spelupplevelsen i Atomic Overhaul: Fullständig ger tillgång till alla funktioner. Förenklad lägger bara till plutonium-239, olika anrikningsgrader av uran, MOX-bränsle och, som tillval, bridreaktorer.
thorium-wrd=Ändrar det vanliga upparbetningsreceptet så att det ger forskningsdata. Samtidigt låses en teknik och ett recept upp som inte ger forskningsdata.
old-graphite-fuel=Återinför det gamla grafitbränslet och dess bearbetning (som före v.1.3.0).
ao-breeder=[color=red]Komplexiteten Förenklad krävs och modden Nuclear Fuel får inte vara inläst.[/color] \nErsätter Kovarex-receptet med bridning: en särskild bränslecell och en särskild kärnreaktor för att framställa klyvbara plutoniumisotoper.
heat-accumulator=Inaktivera detta om du har problem med återkommande fördröjningar!

