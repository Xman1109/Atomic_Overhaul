[Atomic_Overhaul]
menu_Atomic_Overhaul=Atomic Overhaul [img=item.nuclear-waste]
title_Atomic_Overhaul=Atomic Overhaul
page_Atomic_Overhaul_text_1=Atomic Overhaul är en modd för Factorio som lägger till nya kärnbränslen, recept och tekniker i spelet. \n Utvecklad av Xman1109 och fainda.

menu_AO_materials=Material
title_AO_materials=Material
page_AO_materials_text_1=Atomic Overhaul lägger till många nya material som främst används till nya bränsleceller med högre effektivitet än de tidigare.
page_AO_materials_text_2=När du har forskat fram tekniken [font=default-bold]grafitbearbetning[/font] kan du tillverka [font=default-bold]grafit[/font], som behövs för att tillverka [font=default-bold]grafitbränsleceller[/font].
page_AO_materials_text_3=[font=default-bold]Uran[/font] fungerar som i grundspelet. Det används för att tillverka bränsleceller som vid upparbetning ger [font=default-bold]plutonium[/font], [font=default-bold]forskningsdata[/font] och uran-238. Forskningsdata behövs för att forska fram nya tekniker inom kärnteknik.
page_AO_materials_text_4=[font=default-bold]Plutonium[/font] används inte bara för att tillverka nya bränsleceller, utan även för att tillverka [font=default-bold]atombomben[/font] eller det nya [font=default-bold]plutoniumbränslet[/font].
page_AO_materials_text_5=[font=default-bold]MOX[/font] är ett annat [font=default-bold]bränsle[/font] som består av uran och plutonium.
page_AO_materials_text_6=[font=default-bold]Torium[/font] är som standard den [font=default-bold]högsta nivån[/font] av kärnbränsle. Du kan också använda det för att tillverka [font=default-bold]toriummoduler[/font], som ökar hastigheten för bearbetnings- och upparbetningsrecept.

menu_SE_materials=Space Exploration
title_SE_materials=Space Exploration + Atomic Overhaul
page_SE_materials_text_1=Space Exploration av Earendel är en av de populäraste moddarna för Factorio. Atomic Overhaul ger ytterligare innehåll till den modden.
page_SE_materials_text_2=Rymdreaktorn är en prototyp av standardreaktorn. Den har modifierats för att tåla rymdens kalla vakuum och stå emot kosmisk strålning. Den kan bara placeras i rymden och använder enbart våra nya bränsleceller som energikälla.
page_SE_materials_text_3=Du kan nu utvinna den sällsynta isotopen [font=default-bold]iridium-192[/font] ur iridiumpulver och svavelsyra i en strålningsanläggning. Även denna behövs för en kraftfullare bränslecell, med ett bränslevärde på [font=default-bold]17GJ[/font].
page_SE_materials_text_4=[font=default-bold]Holmium-166[/font] är en annan isotop som du nu kan utvinna ur holmiumpulver och svavelsyra i strålningsanläggningen. Den behövs för holmiumbränslecellen, som har ett bränslevärde på [font=default-bold]21GJ[/font].
page_SE_materials_text_5=[font=default-bold]Beryllium[/font] är för närvarande det kraftfullaste kärnbränsle som du kan få i den här modden. Berylliumbränslecellen har ett bränslevärde på [font=default-bold]25GJ[/font].

